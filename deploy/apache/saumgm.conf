# SauMGM on Apache 2.4: serves the built frontend and proxies /api to the API on 127.0.0.1:8000.
# Install: sudo cp deploy/apache/saumgm.conf /etc/apache2/sites-available/
#          edit ServerName, then: sudo a2ensite saumgm && sudo apache2ctl configtest && sudo systemctl reload apache2
# HTTPS:   sudo certbot --apache -d saumgm.example.com   (creates saumgm-le-ssl.conf from this file
#          and redirects HTTP to HTTPS)
# Modules: proxy proxy_http headers rewrite ssl expires (deploy/install-prereqs.sh enables them)

<VirtualHost *:80>
    ServerName saumgm.example.com
    ServerAdmin webmaster@localhost

    DocumentRoot /opt/saumgm/frontend/dist

    # -- API --------------------------------------------------------------------------------------
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 120
    ProxyPass        /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    # Uploads (logo, receipts) are limited to 20 MB by the API; allow a little more here.
    <Location /api>
        LimitRequestBody 26214400
    </Location>

    # -- Frontend (single-page app) ---------------------------------------------------------------
    <Directory /opt/saumgm/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Unknown paths (/invoices/123, ...) are app routes: serve index.html.
        FallbackResource /index.html
    </Directory>

    # Built assets have content hashes in their names: cache them for a year.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    # index.html must always be checked, so a new release is picked up.
    <LocationMatch "^/(index\.html)?$">
        Header set Cache-Control "no-cache"
    </LocationMatch>

    # -- Security headers -------------------------------------------------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
    # Turn on once HTTPS works (in the SSL vhost certbot creates):
    # Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog ${APACHE_LOG_DIR}/saumgm-error.log
    CustomLog ${APACHE_LOG_DIR}/saumgm-access.log combined
</VirtualHost>
