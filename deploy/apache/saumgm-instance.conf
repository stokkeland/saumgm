# Apache site for one of several SauMGM instances. Make a copy per instance with the placeholders
# filled in (see docs/deploy/multiple-instances.md):
#
#   sed -e 's/@NAME@/acme/g' -e 's/@PORT@/8001/g' -e 's/@HOST@/acme.saumgm.example.com/g' \
#       deploy/apache/saumgm-instance.conf | sudo tee /etc/apache2/sites-available/saumgm-acme.conf
#   sudo a2ensite saumgm-acme && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d acme.saumgm.example.com

<VirtualHost *:80>
    ServerName @HOST@

    DocumentRoot /opt/saumgm-@NAME@/frontend/dist

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 120
    ProxyPass        /api http://127.0.0.1:@PORT@/api
    ProxyPassReverse /api http://127.0.0.1:@PORT@/api
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    <Location /api>
        LimitRequestBody 26214400
    </Location>

    <Directory /opt/saumgm-@NAME@/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/(index\.html)?$">
        Header set Cache-Control "no-cache"
    </LocationMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    ErrorLog ${APACHE_LOG_DIR}/saumgm-@NAME@-error.log
    CustomLog ${APACHE_LOG_DIR}/saumgm-@NAME@-access.log combined
</VirtualHost>
