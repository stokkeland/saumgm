[build-system]
requires = ["setuptools>=77"]  # 77+: SPDX license expressions (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "saumgm"
version = "0.1.0"
description = "SauMGM - small business management system (contacts, catalog, invoicing, payments, expenses, sales tax)"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "J. Thomas Stokkeland" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pymysql>=1.1.1",
    "argon2-cffi>=23.1",
    "tzdata>=2024.1",
    "reportlab>=4.2",
    "babel>=2.16",
    "python-multipart>=0.0.12",
]

[project.urls]
Homepage = "https://www.saumgm.com/"
Source = "https://github.com/stokkeland/saumgm"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pypdf>=5.0",
]
prod = [
    "gunicorn>=23",
]
# Only for the one-off MS Access import (Windows + Microsoft Access ODBC driver).
legacy = [
    "pyodbc>=5.1",
]

[tool.setuptools.packages.find]
include = ["saumgm*"]

[tool.setuptools.package-data]
"saumgm.legacy_import" = ["*.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[[tool.mypy.overrides]]
module = ["pyodbc"]
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters with these calls in argument defaults by design.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Path", "fastapi.Body"]

[[tool.mypy.overrides]]
# ReportLab ships without type information.
module = ["reportlab", "reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The page-numbering canvas subclasses ReportLab's (untyped) Canvas.
module = ["saumgm.documents"]
disallow_subclassing_any = false
